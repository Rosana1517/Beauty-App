name: iOS XcodeGen Build

on:
  workflow_dispatch:
  push:
    paths:
      - "iOS_Project/**"
      - ".github/workflows/ios-xcodegen-build.yml"
  pull_request:
    paths:
      - "iOS_Project/**"
      - ".github/workflows/ios-xcodegen-build.yml"

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: iOS_Project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Read runtime config from project.yml
        run: |
          # SUPABASE_URL/SUPABASE_ANON_KEY are committed in plaintext in
          # project.yml's scheme environmentVariables (the anon key is a
          # public, RLS-scoped key by design, not a secret). Read here too
          # so the network-reachability check below can hit the same URL.
          SUPABASE_URL=$(grep -A2 'environmentVariables:' project.yml | grep 'SUPABASE_URL:' | sed -E 's/.*SUPABASE_URL: *"([^"]*)".*/\1/')
          SUPABASE_ANON_KEY=$(grep -A2 'environmentVariables:' project.yml | grep 'SUPABASE_ANON_KEY:' | sed -E 's/.*SUPABASE_ANON_KEY: *"([^"]*)".*/\1/')
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "Read SUPABASE_URL=$SUPABASE_URL (anon key length: ${#SUPABASE_ANON_KEY})"

      - name: Check network reachability from runner
        continue-on-error: true
        run: |
          mkdir -p artifacts
          {
            for url in "https://www.xiaohongshu.com" "https://www.instagram.com" "https://www.youtube.com" "$SUPABASE_URL"; do
              if [ -z "$url" ]; then continue; fi
              echo "== $url =="
              curl -s -o /dev/null -w "HTTP %{http_code}, time %{time_total}s\n" --max-time 10 "$url" || echo "FAILED to connect"
            done
          } | tee artifacts/network-reachability.txt

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Inject CI test credentials into the generated scheme's TestAction
        env:
          CI_TEST_USER_EMAIL: ${{ secrets.CI_TEST_USER_EMAIL }}
          CI_TEST_USER_PASSWORD: ${{ secrets.CI_TEST_USER_PASSWORD }}
        run: |
          # The scheme's TestAction environment variables are the only ones
          # the XCUITest runner process actually sees (a plain env: on the
          # xcodebuild step is invisible to it - see CloudSyncUITests.swift).
          # XcodeGen's top-level scheme.environmentVariables (SUPABASE_URL/
          # SUPABASE_ANON_KEY) already generates a <EnvironmentVariables>
          # block inside TestAction - adding a second sibling block (as an
          # earlier attempt did) produces invalid duplicate XML that Xcode
          # silently ignores. This inserts into that EXISTING block instead.
          python3 - <<'PYEOF'
          import os
          import re
          import sys
          from xml.sax.saxutils import quoteattr

          scheme_path = "BeautifulDiary.xcodeproj/xcshareddata/xcschemes/BeautifulDiary.xcscheme"
          email = os.environ.get("CI_TEST_USER_EMAIL", "")
          password = os.environ.get("CI_TEST_USER_PASSWORD", "")

          with open(scheme_path, "r", encoding="utf-8") as f:
              content = f.read()

          test_action_match = re.search(r"<TestAction.*?</TestAction>", content, re.DOTALL)
          if not test_action_match:
              print("No TestAction element found in generated scheme.")
              sys.exit(1)
          test_action = test_action_match.group(0)

          env_vars_match = re.search(r"<EnvironmentVariables>", test_action)
          if not env_vars_match:
              print("No EnvironmentVariables block found inside TestAction.")
              sys.exit(1)

          entries = (
              f"\n         <EnvironmentVariable\n            key = \"CI_TEST_USER_EMAIL\"\n"
              f"            value = {quoteattr(email)}\n            isEnabled = \"YES\">\n"
              "         </EnvironmentVariable>"
              f"\n         <EnvironmentVariable\n            key = \"CI_TEST_USER_PASSWORD\"\n"
              f"            value = {quoteattr(password)}\n            isEnabled = \"YES\">\n"
              "         </EnvironmentVariable>"
          )

          insertion_point = env_vars_match.end()
          new_test_action = test_action[:insertion_point] + entries + test_action[insertion_point:]
          content = content[:test_action_match.start()] + new_test_action + content[test_action_match.end():]

          with open(scheme_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Injected CI_TEST_USER_EMAIL/CI_TEST_USER_PASSWORD into TestAction's existing EnvironmentVariables block (values redacted from this log).")
          PYEOF

          echo "-- Full TestAction element right after injection (CI_TEST_USER_* values redacted) --"
          python3 - <<'PYEOF'
          import re
          path = "BeautifulDiary.xcodeproj/xcshareddata/xcschemes/BeautifulDiary.xcscheme"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          match = re.search(r"<TestAction.*?</TestAction>", content, re.DOTALL)
          block = match.group(0) if match else "NO TestAction ELEMENT FOUND"
          block = re.sub(r'value = "[^"]*"', 'value = "***"', block)
          print(block)
          PYEOF

      - name: Show schemes
        run: xcodebuild -list -project BeautifulDiary.xcodeproj

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project BeautifulDiary.xcodeproj \
            -scheme BeautifulDiary \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app artifact
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*Build/Products/Debug-iphonesimulator/*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No simulator app found"
            exit 1
          fi
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/BeautifulDiary-simulator-app.zip

      - name: Resolve a concrete simulator destination
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices
            exit 1
          fi
          echo "Using simulator: $DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      # This actually taps through real user flows inside the simulator:
      # - ImportFlowUITests: paste a plain URL, parse, save, see it listed
      # - XiaohongshuImportUITests: same flow against a real 小紅書 share
      #   link, asserting the parsed title isn't the generic fallback
      # - CloudSyncUITests: sign in with a dedicated CI-only Supabase test
      #   account and confirm it reaches "Authenticated" + a real sync
      #   round trip (skips itself if the CI secrets aren't configured)
      # ...instead of only asserting that the app launches without crashing.
      - name: Run UI tests
        run: |
          echo "-- TestAction block right before running tests (keys only, values redacted) --"
          grep -A2 "TestAction\|EnvironmentVariable" BeautifulDiary.xcodeproj/xcshareddata/xcschemes/BeautifulDiary.xcscheme | grep -v "value = " || true

          mkdir -p artifacts
          xcodebuild test \
            -project BeautifulDiary.xcodeproj \
            -scheme BeautifulDiary \
            -destination "id=$DEVICE_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath artifacts/UITests.xcresult

      - name: Extract UI test screenshots
        if: always()
        continue-on-error: true
        run: |
          brew install chargepoint/xcparse/xcparse
          mkdir -p artifacts/ui-test-screenshots
          xcparse screenshots artifacts/UITests.xcresult artifacts/ui-test-screenshots/

      - name: Collect crash reports if the UI test run crashed
        if: always()
        continue-on-error: true
        run: |
          mkdir -p artifacts
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          cp "$CRASH_DIR"/*BeautifulDiary*.ips artifacts/ 2>/dev/null || true
          cp "$CRASH_DIR"/*美麗日記*.ips artifacts/ 2>/dev/null || true

      # Closes the loop beyond the UI's own "Cloud sync finished." message:
      # queries the real Supabase database (via service-role key) to
      # confirm the CI test account's app_users row was actually
      # written/updated moments ago by this run, not just rendered in the app.
      - name: Verify cloud sync actually wrote to Supabase
        if: always()
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "SUPABASE_SECRET_KEY not configured; skipping backend verification."
            exit 0
          fi

          RESPONSE=$(curl -s "$SUPABASE_URL/rest/v1/app_users?email=eq.ci-test@beautifuldiary.app&select=id,updated_at" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY")
          echo "Response: $RESPONSE"
          echo "$RESPONSE" > artifacts/supabase-sync-verification.json

          UPDATED_AT=$(echo "$RESPONSE" | grep -o '"updated_at":"[^"]*"' | head -1 | sed -E 's/"updated_at":"([^"]*)"/\1/')
          if [ -z "$UPDATED_AT" ]; then
            echo "No app_users row found for the CI test account - cloud sync did not actually persist."
            exit 1
          fi

          UPDATED_EPOCH=$(date -j -f "%Y-%m-%dT%H:%M:%S" "${UPDATED_AT%%.*}" "+%s" 2>/dev/null || echo 0)
          NOW_EPOCH=$(date "+%s")
          AGE=$((NOW_EPOCH - UPDATED_EPOCH))
          echo "app_users row last updated $AGE seconds ago (updated_at=$UPDATED_AT)."
          if [ "$AGE" -gt 600 ] || [ "$AGE" -lt 0 ]; then
            echo "Row exists but wasn't updated in this run (>10 min old) - sync may not have actually executed."
            exit 1
          fi
          echo "Confirmed: this CI run's sign-in really wrote to the Supabase app_users table."

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beautiful-diary-simulator-build
          path: iOS_Project/artifacts/BeautifulDiary-simulator-app.zip
          if-no-files-found: ignore

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beautiful-diary-smoke-test-evidence
          path: |
            iOS_Project/artifacts/network-reachability.txt
            iOS_Project/artifacts/UITests.xcresult
            iOS_Project/artifacts/ui-test-screenshots
            iOS_Project/artifacts/supabase-sync-verification.json
            iOS_Project/artifacts/*.ips
          if-no-files-found: ignore
