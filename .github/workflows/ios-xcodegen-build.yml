name: iOS XcodeGen Build

on:
  workflow_dispatch:
  push:
    paths:
      - "iOS_Project/**"
      - ".github/workflows/ios-xcodegen-build.yml"
  pull_request:
    paths:
      - "iOS_Project/**"
      - ".github/workflows/ios-xcodegen-build.yml"

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: iOS_Project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Read runtime config from project.yml
        run: |
          # SUPABASE_URL/SUPABASE_ANON_KEY are committed in plaintext in
          # project.yml's scheme environmentVariables (the anon key is a
          # public, RLS-scoped key by design, not a secret). Read here too
          # so the network-reachability check below can hit the same URL.
          SUPABASE_URL=$(grep -A2 'environmentVariables:' project.yml | grep 'SUPABASE_URL:' | sed -E 's/.*SUPABASE_URL: *"([^"]*)".*/\1/')
          SUPABASE_ANON_KEY=$(grep -A2 'environmentVariables:' project.yml | grep 'SUPABASE_ANON_KEY:' | sed -E 's/.*SUPABASE_ANON_KEY: *"([^"]*)".*/\1/')
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "Read SUPABASE_URL=$SUPABASE_URL (anon key length: ${#SUPABASE_ANON_KEY})"

      - name: Check network reachability from runner
        continue-on-error: true
        run: |
          mkdir -p artifacts
          {
            for url in "https://www.xiaohongshu.com" "https://www.instagram.com" "https://www.youtube.com" "$SUPABASE_URL"; do
              if [ -z "$url" ]; then continue; fi
              echo "== $url =="
              curl -s -o /dev/null -w "HTTP %{http_code}, time %{time_total}s\n" --max-time 10 "$url" || echo "FAILED to connect"
            done
          } | tee artifacts/network-reachability.txt

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Show schemes
        run: xcodebuild -list -project BeautifulDiary.xcodeproj

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project BeautifulDiary.xcodeproj \
            -scheme BeautifulDiary \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app artifact
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*Build/Products/Debug-iphonesimulator/*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No simulator app found"
            exit 1
          fi
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/BeautifulDiary-simulator-app.zip

      - name: Resolve a concrete simulator destination
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices
            exit 1
          fi
          echo "Using simulator: $DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      # This actually taps through the real import flow (Profile > 資源庫 >
      # 匯入精靈 > paste URL > parse > save) inside the simulator via
      # BeautifulDiaryUITests/ImportFlowUITests.swift, instead of only
      # asserting that the app launches without crashing. A crash or any
      # assertion failure during the flow fails this step.
      - name: Run UI test for the import flow
        run: |
          mkdir -p artifacts
          xcodebuild test \
            -project BeautifulDiary.xcodeproj \
            -scheme BeautifulDiary \
            -destination "id=$DEVICE_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath artifacts/ImportFlowUITests.xcresult \
            -only-testing:BeautifulDiaryUITests/ImportFlowUITests

      - name: Extract UI test screenshots
        if: always()
        continue-on-error: true
        run: |
          brew install chargepoint/xcparse/xcparse
          mkdir -p artifacts/ui-test-screenshots
          xcparse screenshots artifacts/ImportFlowUITests.xcresult artifacts/ui-test-screenshots/

      - name: Collect crash reports if the UI test run crashed
        if: always()
        continue-on-error: true
        run: |
          mkdir -p artifacts
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          cp "$CRASH_DIR"/*BeautifulDiary*.ips artifacts/ 2>/dev/null || true
          cp "$CRASH_DIR"/*美麗日記*.ips artifacts/ 2>/dev/null || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beautiful-diary-simulator-build
          path: iOS_Project/artifacts/BeautifulDiary-simulator-app.zip
          if-no-files-found: ignore

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beautiful-diary-smoke-test-evidence
          path: |
            iOS_Project/artifacts/network-reachability.txt
            iOS_Project/artifacts/ImportFlowUITests.xcresult
            iOS_Project/artifacts/ui-test-screenshots
            iOS_Project/artifacts/*.ips
          if-no-files-found: ignore
