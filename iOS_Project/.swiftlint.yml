included:
  - 美麗日記

excluded:
  - BeautifulDiary.xcodeproj
  # Deliberately left with unresolved SwiftLint violations that need real
  # function-signature / DTO refactors (function_parameter_count,
  # function_body_length, optional_data_string_conversion, line_length) -
  # see project_state.md for the full breakdown. Excluded so the rest of
  # the codebase can be a blocking gate; revisit in a dedicated pass.
  - 美麗日記/Services/ResourceImportService+WebPage.swift
  - 美麗日記/Services/ResourceImportService+XHS.swift
  - 美麗日記/Services/SupabaseAuthService+EmailAuthHTTP.swift

# File length is already enforced manually project-wide via the vibe-coding-blocks
# 300-line-per-file convention (see ARCH.md); no need for SwiftLint to duplicate it.
disabled_rules:
  - file_length
  - type_body_length
  - todo
  - trailing_whitespace

opt_in_rules:
  - unused_import
  - redundant_optional_initialization
  - empty_count
  - contains_over_first_not_nil

line_length:
  warning: 160
  error: 220
  ignores_urls: true
  ignores_comments: true

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 25
  error: 40

identifier_name:
  min_length: 1
  excluded:
    - id
    - x
    - y
