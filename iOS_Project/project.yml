name: BeautifulDiary

options:
  bundleIdPrefix: com.rosana1517
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: 2.38.0

settings:
  base:
    PRODUCT_NAME: "美麗日記"
    PRODUCT_BUNDLE_IDENTIFIER: com.rosana1517.beautifuldiary
    SWIFT_VERSION: 5.10
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    # Intentionally empty/Automatic - this project is built two different
    # ways and neither needs a real team ID filled in here:
    #   1. AltStore release builds (.github/workflows/build-ios-release.yml)
    #      explicitly pass CODE_SIGN_IDENTITY=""/CODE_SIGNING_ALLOWED=NO on
    #      the xcodebuild command line, which overrides whatever's here -
    #      the archive is genuinely unsigned; AltServer signs it with the
    #      user's own free Apple ID at install time.
    #   2. If you open this in Xcode locally to Run on your own device, pick
    #      your Personal Team in Signing & Capabilities (Automatic signing
    #      will then resolve it) instead of hardcoding a team ID here, so
    #      this file doesn't end up tied to one person's Apple Developer
    #      account.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Substituted into Info.plist's SupabaseURL/SupabaseAnonKey keys at
    # compile time via $(VAR) macros, so the values are baked into the app
    # bundle itself - needed for any normal launch (sideloaded/AltStore,
    # TestFlight, App Store) where no Xcode scheme environment variable
    # exists. The anon key is public/RLS-scoped by design, not a secret.
    SUPABASE_URL_VALUE: "https://iajbkfbpoaswitawdlpm.supabase.co"
    SUPABASE_ANON_KEY_VALUE: "sb_publishable_Aerb53afbyeend77xwxcLg_snsNj2aB"

targets:
  BeautifulDiary:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: 美麗日記/美麗日記App.swift
      - path: 美麗日記/Info.plist
        buildPhase: none
      - path: 美麗日記/Assets.xcassets
      - path: 美麗日記/Constants/AppConstants.swift
      - path: 美麗日記/Models/DiaryModels.swift
      - path: 美麗日記/Services/BeautyDiaryStore.swift
      - path: 美麗日記/Services/NotificationScheduler.swift
      - path: 美麗日記/Services/ResourceImportService.swift
      - path: 美麗日記/Services/ResourcePipelineServices.swift
      - path: 美麗日記/Services/SupabaseAuthService.swift
      - path: 美麗日記/Views/ContentView.swift
      - path: 美麗日記/Views/MainTabView.swift
      - path: 美麗日記/Views/AppPrototypeViews.swift
    settings:
      base:
        INFOPLIST_FILE: 美麗日記/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ""
    scheme:
      gatherCoverageData: false
      testTargets:
        - BeautifulDiaryUITests
      environmentVariables:
        SUPABASE_URL: "https://iajbkfbpoaswitawdlpm.supabase.co"
        SUPABASE_ANON_KEY: "sb_publishable_Aerb53afbyeend77xwxcLg_snsNj2aB"

  BeautifulDiaryUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: 美麗日記UITests
    settings:
      base:
        # Override the globally-set PRODUCT_NAME/PRODUCT_BUNDLE_IDENTIFIER
        # (settings.base above applies to every target by default) - without
        # this, the UI test target's build product collides with the app's
        # own module output ("Multiple commands produce ... .swiftmodule").
        PRODUCT_NAME: BeautifulDiaryUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.rosana1517.beautifuldiary.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: BeautifulDiary
